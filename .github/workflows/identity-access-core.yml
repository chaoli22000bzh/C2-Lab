name: Identity Access Core Node tests
on:
  push:
    branches: [main]
    paths:
      - 'identity-access-v1/**'
      - '.github/workflows/identity-access-core.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity-access-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
      - name: Build demo scenario
        run: npm run build:demo
      - name: Verify generated demo is committed
        run: git diff --exit-code -- demo/cybernet-scenario.js
