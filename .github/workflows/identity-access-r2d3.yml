name: Identity Access R2D3 real-engine integration
on:
  push:
    branches: [main]
    paths:
      - 'identity-access-v1/**'
      - '.github/workflows/identity-access-r2d3.yml'
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout identity access lab
        uses: actions/checkout@v4
      - name: Checkout pinned R2D3 real engines
        uses: actions/checkout@v4
        with:
          repository: chaoli22000bzh/R2D3
          ref: b497a7168913e0f3c31fad0dcdccfab3a3a4052c
          path: r2d3-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real-module integration test
        working-directory: identity-access-v1
        run: node --test tests/r2d3-real-integration.test.mjs
