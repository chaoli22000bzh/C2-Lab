name: Identity Access Core real R2D3 integration
on:
  push:
    branches: [main]
    paths:
      - 'identity-access-v1/**'
      - '.github/workflows/identity-access-r2d3.yml'
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: C2-Lab
      - uses: actions/checkout@v4
        with:
          repository: chaoli22000bzh/R2D3
          ref: main
          path: r2d3-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real integration against R2D3 source modules
        working-directory: C2-Lab/identity-access-v1
        env:
          R2D3_SOURCE_ROOT: ../../r2d3-source
        run: node --test tests/integration-real.mjs
