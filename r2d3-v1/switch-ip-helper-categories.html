<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R2D3 : contrôle des catégories de switchs</title><style>
:root{font:16px/1.5 system-ui,Arial,sans-serif;color-scheme:light dark}
body{max-width:900px;margin:auto;padding:16px}h1{font-size:1.5rem}h2{font-size:1.1rem}
section{border:1px solid #8797a377;border-radius:12px;padding:16px;margin:14px 0}

<p><a href="./">Retour au laboratoire R2D3</a></p>

</div></section>
