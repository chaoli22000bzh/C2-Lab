<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration du switch</title>
<link rel="stylesheet" href="./switch-admin-ui-v1.css?v=6.1"><style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;color:#293b43;font:16px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
.workspace{max-width:1020px;margin:auto;background:#fff;min-height:100vh;border-inline:1px solid #e3e8eb}
.device-picker{display:flex;align-items:center;gap:11px;min-height:45px;padding:5px 23px;background:#f2f6f7}
.device-picker label{color:#4a626a;font-weight:600;font-size:16px}
.device-picker select{font:inherit;font-size:16px;padding:4px 10px;border:1px solid #bbcbce;border-radius:3px;background:#fff;color:#293b43;min-height:34px}
#lab-error{padding:0 24px}
@media(max-width:600px){.device-picker{padding:7px 14px}}
</style></head><body><div class="workspace">
<div class="device-picker"><label for="switch-choice">Équipement</label><select id="switch-choice"><option value="l2">SW-L2</option><option value="l3">SW-L3</option></select></div>
<div id="host"></div><p id="lab-error" role="alert"></p></div>
<script type="module" src="./switch-admin-ui-demo-v1.js?v=6"></script></body></html>
